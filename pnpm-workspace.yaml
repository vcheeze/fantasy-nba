# `packages` is required by the pnpm Vercel runs. `allowBuilds` is what
# pnpm 10.26+ reads instead of package.json "pnpm.onlyBuiltDependencies".
packages:
  - '.'
allowBuilds:
  '@vercel/speed-insights': true
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@next/env@16.4.4'
  - '@next/swc-darwin-arm64@16.4.4'
  - '@next/swc-darwin-x64@16.4.4'
  - '@next/swc-linux-arm64-gnu@16.4.4'
  - '@next/swc-linux-arm64-musl@16.4.4'
  - '@next/swc-linux-x64-gnu@16.4.4'
  - '@next/swc-linux-x64-musl@16.4.4'
  - '@next/swc-win32-arm64-msvc@16.4.4'
  - '@next/swc-win32-x64-msvc@16.4.4'
  - '@next/third-parties@16.4.4'
  - next@16.4.4
  - '@next/eslint-plugin-next@16.4.4'
  - eslint-config-next@16.4.4
overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
